apiVersion: 1

datasources:
  # The `uid` is pinned on purpose: both provisioned dashboards
  # (mini-doodle-baseline.json and mini-doodle-load-test.json) hardcode this exact UID in every
  # panel's datasource object. Removing or changing it breaks every panel in both dashboards,
  # silently, at render time. Do not let Grafana auto-assign a UID here.
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: PBFA97CFB590B2093
    isDefault: true
    editable: false

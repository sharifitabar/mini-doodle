spring:
  datasource:
    url: jdbc:tc:postgresql:16:///minidoodle
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES

app:
  seed-demo-data: false
  slot:
    max-duration-minutes: 1440
  outbox:
    # Tests call pollOnce() and cleanupOnce() directly. A long interval keeps the scheduler
    # from delivering rows in the background while a test asserts on them.
    poll-interval: 1h
    batch-size: 50
    max-attempts: 5
    cleanup-interval: 1h
    retention: 7d

logging:
  level:
    org.testcontainers: INFO

spring:
  application:
    name: mini-doodle
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minidoodle}
    username: ${DB_USER:minidoodle}
    password: ${DB_PASSWORD:minidoodle}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  slot:
    max-duration-minutes: ${SLOT_MAX_DURATION_MINUTES:1440}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/minidoodle

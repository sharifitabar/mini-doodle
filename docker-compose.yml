services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: minidoodle
      POSTGRES_USER: minidoodle
      POSTGRES_PASSWORD: minidoodle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minidoodle -d minidoodle"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/minidoodle
      DB_USER: minidoodle
      DB_PASSWORD: minidoodle
    ports:
      - "8080:8080"

volumes:
  db-data:

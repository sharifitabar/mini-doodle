global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: minidoodle
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  # Database-side pressure, so a load-test run can tell "the database was the bottleneck"
  # from "the service was the bottleneck" on one timeline (feature 007).
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
